name: Python verify and build for PyPI (reusable)

# Ověření release tagu/verze a build distribuce pro publikaci na PyPI. Samotný upload NEDĚLÁ:
# PyPI oficiálně nepodporuje reusable workflow jako Trusted Publisher, proto upload
# (pypa/gh-action-pypi-publish s id-token: write) patří přímo do volajícího publish.yml,
# který si artefakt "python-dist" stáhne. Viz docs/pypi-trusted-publishing.md.
# Volání: uses: SYSNET-CZ/.github/.github/workflows/python-build.yml@v1.2.0

on:
  workflow_call:
    inputs:
      package-name:
        description: 'Distribuční název na PyPI (např. sysnet-pyutils)'
        type: string
        required: true
      python-version:
        type: string
        default: '3.12'
      repository-url:
        description: 'Prázdné = produkční PyPI; https://test.pypi.org/legacy/ = TestPyPI'
        type: string
        default: ''
      main-branch:
        description: 'Větev, ze které smí release tag pocházet'
        type: string
        default: 'main'
    outputs:
      version:
        description: 'Publikovaná verze'
        value: ${{ jobs.verify.outputs.version }}

permissions: {}

jobs:
  verify:
    name: Verify tag and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.dist.outputs.version }}
    steps:
      - name: Require release tag vX.Y.Z
        if: ${{ !contains(inputs.repository-url, 'test.pypi.org') }}
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Publikace je povolena jen z tagu vX.Y.Z (ref_type=$REF_TYPE, ref=$TAG)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged commit on main branch
        if: ${{ !contains(inputs.repository-url, 'test.pypi.org') }}
        env:
          MAIN_BRANCH: ${{ inputs.main-branch }}
        run: |
          git fetch --no-tags origin "$MAIN_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$MAIN_BRANCH"; then
            echo "::error::Tagovaný commit není na větvi $MAIN_BRANCH"
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine packaging
          python -m build --outdir dist
          twine check --strict dist/*
      - name: Verify distribution matches tag and package name
        id: dist
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
          TAG: ${{ github.ref_name }}
          # TestPyPI: žádný tag, ale verze MUSÍ být dev release (X.Y.Z.devN), aby nešlo vydat produkční verzi
          TEST_MODE: ${{ contains(inputs.repository-url, 'test.pypi.org') }}
        run: |
          python - <<'PY'
          import glob, os, sys, tarfile, zipfile
          from email.parser import Parser
          from packaging.utils import canonicalize_name
          from packaging.version import Version

          expected_name = canonicalize_name(os.environ["PACKAGE_NAME"])
          test_mode = os.environ.get("TEST_MODE") == "true"
          expected_version = None if test_mode else Version(os.environ["TAG"].removeprefix("v"))
          seen_versions = set()
          errors = []
          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          if len(wheels) != 1 or len(sdists) != 1:
              errors.append(f"očekáván 1 wheel a 1 sdist, nalezeno {len(wheels)}/{len(sdists)}")
          for path in wheels + sdists:
              if path.endswith(".whl"):
                  with zipfile.ZipFile(path) as z:
                      name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
                      meta = Parser().parsestr(z.read(name).decode())
              else:
                  with tarfile.open(path) as t:
                      member = next(m for m in t.getmembers() if m.name.count("/") == 1 and m.name.endswith("/PKG-INFO"))
                      meta = Parser().parsestr(t.extractfile(member).read().decode())
              if canonicalize_name(meta["Name"]) != expected_name:
                  errors.append(f"{path}: název {meta['Name']} != {expected_name}")
              version = Version(meta["Version"])
              seen_versions.add(version)
              if test_mode:
                  if not version.is_devrelease:
                      errors.append(f"{path}: TestPyPI přijímá jen dev verze (X.Y.Z.devN), nalezeno {version}")
              elif version != expected_version:
                  errors.append(f"{path}: verze {meta['Version']} != tag {os.environ['TAG']}")
          if test_mode and len(seen_versions) == 1:
              expected_version = next(iter(seen_versions))
          elif test_mode:
              errors.append(f"nesourodé verze v archivech: {sorted(map(str, seen_versions))}")
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={expected_version}\n")
          PY
      - name: Refuse to republish an existing version
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
          VERSION: ${{ steps.dist.outputs.version }}
          REPOSITORY_URL: ${{ inputs.repository-url }}
        run: |
          host=pypi.org
          case "$REPOSITORY_URL" in *test.pypi.org*) host=test.pypi.org ;; esac
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$host/pypi/$PACKAGE_NAME/$VERSION/json")
          if [ "$code" = "200" ]; then
            echo "::error::Verze $VERSION balíčku $PACKAGE_NAME už na $host existuje; verzi nelze přepsat, vydejte novou."
            exit 1
          elif [ "$code" != "404" ]; then
            echo "::error::Neočekávaná odpověď $host: HTTP $code"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
