name: CI — Docker Build & Push

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      service:
        description: "Název služby (adresář v services/ nebo kořen repozitáře)"
        required: false
        default: ""

env:
  # Upravte dle projektu — název image bez tagu
  IMAGE_NAME: sysnetcz/${{ github.event.repository.name }}

jobs:
  build-and-push:
    name: Build and push
    # Self-hosted runner (hermes-vm) — SYSNET-CZ infrastruktura
    # Nespotřebovává GitHub Actions minuty
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          # Zkus načíst verzi ze souboru VERSION, jinak použij git tag nebo 'dev'
          if [ -f VERSION ]; then
            echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
