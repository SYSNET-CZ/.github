name: CI — Python

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Lint, typecheck & tests
    # Self-hosted runner (hermes-vm) — SYSNET-CZ infrastruktura
    # Nespotřebovává GitHub Actions minuty
    runs-on: self-hosted

    # Odkomentujte pokud projekt potřebuje MongoDB:
    # services:
    #   mongo:
    #     image: mongo:7
    #     ports:
    #       - 27017/tcp
    #     env:
    #       MONGO_INITDB_ROOT_USERNAME: root
    #       MONGO_INITDB_ROOT_PASSWORD: test
    #     options: >-
    #       --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' --quiet"
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5

    # Odkomentujte pokud projekt potřebuje PostgreSQL:
    # services:
    #   postgres:
    #     image: postgres:16
    #     ports:
    #       - 5432/tcp
    #     env:
    #       POSTGRES_DB: test_db
    #       POSTGRES_USER: test
    #       POSTGRES_PASSWORD: test
    #     options: >-
    #       --health-cmd "pg_isready -U test"
    #       --health-interval 5s
    #       --health-timeout 5s
    #       --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Upravte dle projektu
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app
        # Upravte cestu dle struktury projektu (app, src, ...)

      - name: Tests
        # Porty service kontejnerů jsou dynamické — předávají se přes env
        # Příklady (odkomentujte co potřebujete):
        # env:
        #   MONGO_PORT: ${{ job.services.mongo.ports['27017'] }}
        #   DATABASE_URL: postgresql+asyncpg://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/test_db
        run: |
          pytest tests/ -q --tb=short
